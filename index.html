<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta title="discription" content="这是一个几何绘图器，可以用它来很方便地进行几何作图">
  <title>几何绘图器</title>
  <link rel="stylesheet" href="./style.css"/>
  <script src="./interaction.js" type="module"></script>
  <noscript>如果希望此应用能够在您的浏览器上运行，请开启浏览器脚本。</noscript>
</head>
<body>
  <aside>
    <div id="aside-content">
      <p id="hide-aside">x</p>
      <button data-op="change-mode" class="operate-choice" id="change-mode-button">编辑</button>
      <div id="create-mode">
        <p class="operate-choice">基础操作</p>
        <button data-op="create-points" class="operate-choice">描点</button>
        <p class="operate-choice">线</p>
        <button data-op="create-line-seg" class="operate-choice">线段</button>
        <button data-op="create-ray" class="operate-choice">射线</button>
        <button data-op="create-straight-line" class="operate-choice">直线</button>
        <p class="operate-choice">圆与弧</p>
        <button data-op="create-circle" class="operate-choice">圆（圆心+圆上一点）</button>
        <button data-op="create-clockwise-arc" class="operate-choice">圆弧（顺时针）</button>
        <p class="operate-choice">点</p>
        <button data-op="create-midpoint" class="operate-choice">中点</button>
      </div>
      <div id="edit-mode" style="display: none;">
        <p>Sorry~还没有开发哦~</p>
      </div>
    </div>
  </aside>
  <b id="show-aside">&gt;</b>

  <div id="board">
    <svg id="paint-area">
      很抱歉，您的浏览器不支持此程序所需的绘制功能，所以您暂时无法使用此程序。您可以更换一台电脑或升级浏览器来尝试运行。
    </svg>
  </div>
</body>
</html>
